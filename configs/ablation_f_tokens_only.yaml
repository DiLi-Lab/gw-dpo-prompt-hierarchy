# Ablation (f): tokens-only — special delimiter tokens but NO ISE layer.
#
# Identical to configs/base_linear.yaml except model.use_ise = false. The 12
# hierarchy delimiter tokens are still added to the tokenizer, the
# embedding matrix is still resized (mean-init), and SFT/DPO still train
# the trainable_token_indices for those rows. The only thing missing is
# the additive InstructionalSegmentEmbedding layer at the input.
#
# Comparison target: (d) GW-DPO. The (d)→(f) gap measures the marginal
# contribution of ISE on top of trained delimiter tokens — i.e. whether
# the continuous per-token segment signal that propagates through every
# self-attention layer matters once the discrete boundary markers are
# already learnable.
#
# All DPO hyperparameters (β, α, curriculum, sDPO) are held at the
# (d)-canonical values from the HP sweep so the only changing variable
# is ISE on/off.
#
# Run with:
#   # SFT (writes to a fresh sft_<timestamp> run dir; no ise_weights.pt
#   # is co-located with checkpoints when use_ise=false):
#   python bin/train_sft.py --config configs/ablation_f_tokens_only.yaml
#
#   # Merge SFT (use the run dir produced above):
#   python bin/merge_sft.py \
#       --config configs/ablation_f_tokens_only.yaml \
#       --sft-checkpoint models/runs/sft_<timestamp>/best-checkpoint \
#       --output-dir models/llama-3.1-8b-sft-merged-no-ise
#
#   # DPO with the no-ISE merged checkpoint, writing to distinct merged
#   # and final dirs so configurations (b) and (d) are preserved:
#   python bin/train_dpo.py \
#       --config configs/ablation_f_tokens_only.yaml \
#       --sft-checkpoint models/runs/sft_<timestamp>/best-checkpoint \
#       --merged-dir models/llama-3.1-8b-sft-merged-no-ise \
#       --final-dir models/llama-3.1-8b-gw-dpo-no-ise-final
#
# Both overrides are mandatory: without --final-dir the trainer would
# overwrite models/llama-3.1-8b-gw-dpo-final/ (configuration (d)); without
# --merged-dir it would skip-merge against the existing ISE-on (b)
# artifact at models/llama-3.1-8b-sft-merged/ and feed the wrong
# initialisation into the (f) DPO run.

model:
  model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  num_segments: 6
  token_embedding_init: "mean"
  ise_embedding_init: "normal"
  ise_init_std: 0.01
  use_ise: false

sft:
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_length: 4096
  weight_decay: 0.01
  precision: "bf16"
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  save_steps: 50
  eval_steps: 50
  save_total_limit: 5
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

dpo:
  beta: 0.1
  gravity_alpha: 0.3
  margin_schedule: "gap"
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_curriculum_stages: 3
  curriculum_enabled: true
  epochs_per_stage: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  max_seq_length: 2048
  weight_decay: 0.01
  precision: "bf16"
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  save_steps: 30
  eval_steps: 30
  save_total_limit: 2
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

eval:
  count_per_pair: 100
  num_pairs: 10
  reference_per_pair: 30
  near_dedup_threshold: 0.85
  scenario_model: "gpt-4o"
  scenario_temperature: 0.7
  scenario_max_tokens: 2000
  gold_model: "claude-sonnet-4-20250514"
  gold_temperature: 0.3
  control_model: "gpt-4o-mini"
  judge_model_1: "gpt-4o"
  judge_model_2: "gemini-2.5-pro"
  judge_min_score: 4
  max_retries: 2
  seed: 42

evaluation:
  generation_max_new_tokens: 1024
  generation_temperature: 0.0
  generation_batch_size: 4
  judge_model: "gpt-4o"
  judge_temperature: 0.0
  judge_max_tokens: 800
  orr_min_response_chars_for_judge: 200
  reward_batch_size: 2
  bertscore_model: "roberta-large"
  run_text_similarity: true
  run_rewards: false

paths:
  project_root: "."
