# Bilateral / victim-weighted GW-DPO production configuration.
#
# This is one of the two headline production configurations reported in
# the paper:
#
#   - base_linear.yaml    → linear margin schedule
#                           δ = j − i
#   - base_bilateral.yaml → bilateral / victim-weighted schedule
#                           δ = (j − i)·(k − 1 − i), k = 5  (this file)
#
# Identical to configs/base_linear.yaml except
# dpo.margin_schedule = "bilateral". The trainer multiplies δ by
# gravity_alpha at runtime, so the implied reward gap is
# α · (j − i) · (k − 1 − i). Severity scales with both the privilege
# distance (gap) and the intrinsic value of the victim level (asset /
# bilateral weighting) — hence "bilateral".
#
# Reference δ values across the 10 pairwise conflicts (compare with the
# linear schedule δ = j − i used by base_linear.yaml):
#
#   pair          gap (j−i)   victim weight (k−1−i)   bilateral δ
#   L0 vs L1        1               4                       4
#   L0 vs L2        2               4                       8
#   L0 vs L3        3               4                      12
#   L0 vs L4        4               4                      16
#   L1 vs L2        1               3                       3
#   L1 vs L3        2               3                       6
#   L1 vs L4        3               3                       9
#   L2 vs L3        1               2                       2
#   L2 vs L4        2               2                       4
#   L3 vs L4        1               1                       1
#
# The most distinctive shift vs the linear schedule is at small gaps
# with high-privilege victims (L0 vs L1, L1 vs L2): the bilateral
# schedule penalises these substantially harder while leaving L3 vs L4
# unchanged.
#
# Calibration rows (is_calibration=true) always force δ = 0 regardless
# of schedule — this is enforced inside the collator, not in YAML.
#
# β = 0.1 and gravity_alpha = 0.3 match base_linear.yaml for
# apples-to-apples comparison. We deliberately do not rescale α for the
# bilateral schedule; if reviewers request an average-margin-matched
# run, that becomes a follow-on config. Curriculum stays ON so the
# train trajectory matches base_linear.yaml — the only difference
# between the two production configurations is the schedule formula.
#
# Run with:
#   python bin/train_dpo.py \
#     --config configs/base_bilateral.yaml \
#     --final-dir models/llama-3.1-8b-gw-dpo-bilateral-final
#
# The --final-dir override is mandatory: without it the trainer would
# overwrite models/llama-3.1-8b-gw-dpo-final/, which is reserved for
# the linear-schedule production run (base_linear.yaml). The
# `bilateral` external-benchmark registry nickname
# (src/evaluation/external/registry.py) resolves to this final-dir.

model:
  model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  num_segments: 6
  token_embedding_init: "mean"
  ise_embedding_init: "normal"
  ise_init_std: 0.01
  use_ise: true

sft:
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_length: 4096
  weight_decay: 0.01
  precision: "bf16"
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  save_steps: 50
  eval_steps: 50
  save_total_limit: 5
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

dpo:
  beta: 0.1
  gravity_alpha: 0.3
  margin_schedule: "bilateral"
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_curriculum_stages: 3
  curriculum_enabled: true
  epochs_per_stage: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  max_seq_length: 2048
  weight_decay: 0.01
  precision: "bf16"
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  save_steps: 30
  eval_steps: 30
  save_total_limit: 2
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

eval:
  count_per_pair: 100
  num_pairs: 10
  reference_per_pair: 30
  near_dedup_threshold: 0.85
  scenario_model: "gpt-4o"
  scenario_temperature: 0.7
  scenario_max_tokens: 2000
  gold_model: "claude-sonnet-4-20250514"
  gold_temperature: 0.3
  control_model: "gpt-4o-mini"
  judge_model_1: "gpt-4o"
  judge_model_2: "gemini-2.5-pro"
  judge_min_score: 4
  max_retries: 2
  seed: 42

evaluation:
  generation_max_new_tokens: 1024
  generation_temperature: 0.0
  generation_batch_size: 4
  judge_model: "gpt-4o"
  judge_temperature: 0.0
  judge_max_tokens: 800
  orr_min_response_chars_for_judge: 200
  reward_batch_size: 2
  bertscore_model: "roberta-large"
  run_text_similarity: true
  run_rewards: false

paths:
  project_root: "."
