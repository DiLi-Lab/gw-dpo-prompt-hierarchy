# Test configuration: small model for fast pipeline smoke tests.
# Uses a separate test-run/ directory so production artifacts are untouched.
#
# Usage:
#    bin/run_test.sh              # full pipeline: setup + train
#    bin/run_test.sh --setup-only # just download and prepare the model
#    bin/run_test.sh --train-only # just train (assumes setup already done)

model:
  model_name_or_path: "meta-llama/Llama-3.2-1B-Instruct"
  torch_dtype: "bfloat16"
  num_segments: 6
  token_embedding_init: "mean"
  ise_embedding_init: "normal"
  ise_init_std: 0.01
  use_ise: true

sft:
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  max_seq_length: 2048
  weight_decay: 0.01
  precision: "bf16"
  # LoRA — smaller rank for faster test
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  # More frequent checkpoints for a short run
  save_steps: 25
  eval_steps: 25
  save_total_limit: 2
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

dpo:
  beta: 0.1
  gravity_alpha: 1.0
  margin_schedule: "gap"
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_curriculum_stages: 3
  curriculum_enabled: true
  epochs_per_stage: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  max_seq_length: 1024
  weight_decay: 0.01
  precision: "bf16"
  # LoRA
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"
  # Checkpointing and evaluation
  # At grad_accum=2, per-stage optimizer-step counts are ~2080/3320/4368.
  # eval_steps=250 gives ~8/13/17 evals per stage — enough to exercise
  # the best-forward path and see a meaningful trajectory, without
  # drowning the smoke test in eval overhead.
  save_steps: 250
  eval_steps: 250
  save_total_limit: 2
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  logging_steps: 1

eval:
  count_per_pair: 100
  num_pairs: 10
  reference_per_pair: 30
  near_dedup_threshold: 0.85
  scenario_model: "gpt-4o"
  scenario_temperature: 0.7
  scenario_max_tokens: 2000
  gold_model: "claude-sonnet-4-20250514"
  gold_temperature: 0.3
  control_model: "gpt-4o-mini"
  judge_model_1: "gpt-4o"
  judge_model_2: "gemini-2.5-pro"
  judge_min_score: 4
  max_retries: 2
  seed: 42

paths:
  project_root: "test-run"
